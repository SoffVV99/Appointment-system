services:
  db:
    image: postgres:15
    container_name: salon_db
    environment:
      - TZ=Europe/Sofia
      - POSTGRES_USER=salon_admin
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=salon
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: salon_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@salon.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: ./backend
    env_file:
      - .env
    container_name: salon_backend
    environment:
      - TZ=Europe/Sofia
      - FLASK_APP=app.py
      - FLASK_ENV=development
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  nginx:
    image: nginx:latest
    container_name: salon_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  glances:
    image: nicolargo/glances:latest-full
    container_name: salon_glances
    environment:
      - GLANCES_OPT=-w
    ports:
      - "61208:61208"
    pid: host

volumes:
  pgdata: