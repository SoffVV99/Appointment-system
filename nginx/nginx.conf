events {}

http {
    server {
        listen 80;
        server_name denistyle.bg www.denistyle.bg;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name denistyle.bg www.denistyle.bg;

        ssl_certificate /etc/letsencrypt/live/denistyle.bg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/denistyle.bg/privkey.pem;

        location / {
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}