<!DOCTYPE html>
<html lang="bg">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Салон за красота</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fafafa; margin: 0; padding: 20px; color: #111; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-top: 4px solid #d4af37; }
        .view { display: none; }
        .view.active { display: block; }
        h1, h2 { color: #111; text-align: center; text-transform: uppercase; letter-spacing: 2px; font-weight: 400; }
        
        .staff-grid { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .staff-card { border: 1px solid #eee; padding: 25px; border-radius: 4px; cursor: pointer; text-align: center; flex: 1; transition: 0.3s; background: #fff; }
        .staff-card:hover { border-color: #d4af37; box-shadow: 0 4px 15px rgba(212,175,55,0.15); }
        .staff-card h3 { margin: 0 0 10px 0; color: #111; letter-spacing: 1px; }
        .staff-card p { margin: 0; color: #888; font-style: italic; }

        .controls { text-align: center; margin-bottom: 20px; }
        select, input { padding: 12px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; font-size: 15px; border-radius: 0; background: #fafafa; }
        select { width: 250px; }
        select:focus, input:focus { outline: none; border-color: #d4af37; }
        
        .schedule-grid { display: flex; gap: 15px; flex-wrap: wrap; }
        .day-column { flex: 1; border: 1px solid #eee; padding: 15px; background: #fff; min-width: 150px; }
        .day-title { text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #d4af37; color: #111; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
        
        .slot-btn { display: block; width: 100%; margin-bottom: 8px; padding: 10px; background: white; border: 1px solid #ccc; color: #111; border-radius: 2px; cursor: pointer; transition: 0.2s; }
        .slot-btn:hover { background: #111; color: #d4af37; border-color: #111; }
        
        .btn-nav { background: transparent; color: #111; border: 1px solid #111; padding: 8px 20px; border-radius: 2px; cursor: pointer; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; transition: 0.2s; }
        .btn-nav:hover { background: #111; color: #d4af37; }
        
        .btn-submit { width: 100%; padding: 15px; background: #111; color: #d4af37; border: 1px solid #111; border-radius: 2px; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn-submit:hover { background: #d4af37; color: #111; border-color: #d4af37; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        
        .top-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .top-nav a { color: #111; text-decoration: none; padding: 10px 20px; border: 1px solid #111; border-radius: 2px; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; transition: 0.3s; }
        .top-nav a:hover { background: #111; color: #d4af37; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="top-nav">
        <a href="/">Запази час</a>
        <a href="/pricelist" target="_blank">Ценоразпис</a>
    </div>

    <div class="top-nav" style="border-bottom: none; margin-bottom: 20px;">
        <a href="tel:0896184325" style="border-color: #555; color: #555;">Обади се</a>
        <a href="https://www.instagram.com/deni.style_?utm_source=ig_web_button_share_sheet&xtok=ZDNlZDc0MzIxNw==" target="_blank" style="border-color: #555; color: #555;">Instagram</a>
    </div>

    <div id="step-staff" class="view active">
        <img src="/static/logo.jpg" alt="Deni Style Logo" style="max-width: 150px; display: block; margin: 0 auto 15px auto; border-radius: 50%;">
        <h1>Изберете специалист</h1>
        <div id="staffList" class="staff-grid">Зареждане...</div>
        
        <div style="text-align: center; margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px;">
            <a href="#" onclick="showStep('step-cancel')" style="color: #636e72; font-size: 14px;">Искате да отмените свой запазен час?</a>
        </div>
    </div>

    <div id="step-schedule" class="view">
        <button class="btn-nav" onclick="showStep('step-staff')">← Назад</button>
        <h2 id="selectedStaffName">График</h2>
        <div class="controls">
            <select id="serviceSelect" onchange="loadSchedule()">
                <option value="">-- Изберете процедура --</option>
            </select>
        </div>
        <div id="scheduleContainer" class="schedule-grid" style="display: none;"></div>
    </div>

    <div id="step-booking" class="view">
        <button class="btn-nav" onclick="showStep('step-schedule')">← Назад</button>
        <h2>Завършване на резервацията</h2>
        <p id="bookingSummary" style="text-align: center; color: #d4af37; font-weight: bold;"></p>
        <form id="finalForm">
            <div class="form-group"><label>Име и фамилия:</label><input type="text" id="clientName" required></div>
            <div class="form-group"><label>Телефон:</label><input type="tel" id="clientPhone" required></div>
            <button type="submit" class="btn-submit">Запази час</button>
        </form>
        <div id="responseMessage" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
    </div>

    <div id="step-cancel" class="view">
        <button class="btn-nav" onclick="showStep('step-staff')">← Назад</button>
        <h2>Отмяна на резервация</h2>
        <div class="form-group">
            <label>Въведете телефона, с който сте запазили часа:</label>
            <input type="tel" id="cancelPhone" placeholder="напр. 088...">
        </div>
        <button onclick="findAppointments()" class="btn-submit">Покажи моите часове</button>
        <div id="cancelList" style="margin-top: 20px;"></div>
    </div>

</div>

<script>
    let selectedStaffId = null;
    let selectedServiceId = null;
    let selectedTime = null;
    let allServices = []; 

    fetch('/api/staff').then(r => r.json()).then(data => {
        const grid = document.getElementById('staffList');
        grid.innerHTML = '';
        if (data.length === 0) {
            grid.innerHTML = '<p style="color:#d9534f; text-align:center;">Все още няма добавен персонал. Влезте в админ панела (/login), за да добавите!</p>';
        }
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'staff-card';
            card.innerHTML = `<h3>${p.name}</h3><p>${p.role}</p>`;
            card.onclick = () => selectStaff(p.id, p.name, p.role);
            grid.appendChild(card);
        });
    });

    fetch('/api/services').then(r => r.json()).then(data => { allServices = data; });

    function showStep(stepId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function selectStaff(id, name, role) {
        selectedStaffId = id;
        document.getElementById('selectedStaffName').innerText = `График на ${name}`;
        
        const select = document.getElementById('serviceSelect');
        select.innerHTML = '<option value="">-- Изберете процедура --</option>';
        
        const filteredServices = allServices.filter(s => s.staff_role.includes(name) || s.staff_role.includes(role));
        
        filteredServices.forEach(s => {
            select.innerHTML += `<option value="${s.id}">[${s.category || 'Общи'}${s.subcategory && s.subcategory !== 'none' ? ' / ' + s.subcategory : ''}] ${s.name} - € ${s.price || ''} (${s.duration_minutes} мин)</option>`;
        });
        
        document.getElementById('scheduleContainer').style.display = 'none';
        showStep('step-schedule');
    }

    function loadSchedule() {
        selectedServiceId = document.getElementById('serviceSelect').value;
        const container = document.getElementById('scheduleContainer');
        if (!selectedServiceId) { container.style.display = 'none'; return; }

        container.style.display = 'flex';
        container.innerHTML = '<p style="text-align:center; width:100%;">Зареждане на часове...</p>';
        const startDateStr = new Date().toISOString().split("T")[0];

        fetch(`/api/schedule?staff_id=${selectedStaffId}&service_id=${selectedServiceId}&start_date=${startDateStr}`)
            .then(r => r.json())
            .then(data => {
                container.innerHTML = '';
                for (const [dateStr, slots] of Object.entries(data)) {
                    const col = document.createElement('div');
                    col.className = 'day-column';
                    const dateObj = new Date(dateStr);
                    col.innerHTML = `<div class="day-title">${dateObj.toLocaleDateString('bg-BG', { weekday: 'short', day: '2-digit', month: '2-digit' })}</div>`;
                    
                    if (slots.length === 0) col.innerHTML += `<p style="text-align:center; font-size:12px;">Няма свободни</p>`;
                    else {
                        slots.forEach(time => {
                            const btn = document.createElement('button');
                            btn.className = 'slot-btn';
                            btn.innerText = time;
                            btn.onclick = () => openBookingForm(dateStr, time);
                            col.appendChild(btn);
                        });
                    }
                    container.appendChild(col);
                }
            });
    }

    function openBookingForm(date, time) {
        selectedTime = `${date}T${time}`;
        document.getElementById('bookingSummary').innerText = `Избран час: ${date} от ${time} ч.`;
        showStep('step-booking');
    }

    document.getElementById('finalForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const payload = {
            client_name: document.getElementById('clientName').value,
            client_phone: document.getElementById('clientPhone').value,
            staff_id: selectedStaffId, service_id: selectedServiceId, start_time: selectedTime
        };
        fetch('/api/book', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(r => r.json().then(res => ({status: r.status, body: res})))
        .then(res => {
            const msg = document.getElementById('responseMessage');
            if (res.status === 201) {
                msg.style.color = "green"; msg.innerText = "Успешна резервация!";
                document.getElementById('finalForm').style.display = 'none';
                setTimeout(() => location.reload(), 3000);
            } else { msg.style.color = "red"; msg.innerText = res.body.error; }
        });
    });

    function findAppointments() {
        const phone = document.getElementById('cancelPhone').value;
        fetch('/api/my_appointments', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({phone}) })
        .then(r => r.json())
        .then(apps => {
            const list = document.getElementById('cancelList');
            list.innerHTML = '';
            if(apps.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#d9534f;">Няма намерени часове за този телефон.</p>';
                return;
            }
            apps.forEach(app => {
                const div = document.createElement('div');
                div.style = "border: 1px solid #eee; padding: 15px; margin-bottom: 10px; background: #fff;";
                const date = new Date(app.start_time).toLocaleString('bg-BG');
                div.innerHTML = `
                    <div style="float:left;">
                        <strong>${app.service_name}</strong> при ${app.staff_name}<br>
                        <span style="color:#888;">Време: ${date}</span>
                    </div>
                    <button onclick="cancelAppt(${app.id}, this)" style="float:right; background: #111; color: #d4af37; border: 1px solid #d4af37; padding: 10px; border-radius: 2px; cursor: pointer; text-transform: uppercase; font-size: 11px;">Откажи</button>
                    <div style="clear:both;"></div>
                `;
                list.appendChild(div);
            });
        });
    }

    function cancelAppt(id, btnElement) {
        if (btnElement.innerText.trim().toLowerCase() === "откажи") {
            btnElement.innerText = "Потвърди?";
            btnElement.style.background = "#d9534f"; 
            btnElement.style.color = "white";
            btnElement.style.borderColor = "#d9534f";
            return; 
        }

        fetch('/api/cancel', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({id}) 
        })
        .then(r => r.json())
        .then(res => {
            let msgDiv = document.getElementById('cancel-message');
            if (!msgDiv) {
                msgDiv = document.createElement('div');
                msgDiv.id = 'cancel-message';
                msgDiv.style.margin = '15px 0';
                msgDiv.style.padding = '10px';
                msgDiv.style.textAlign = 'center';
                msgDiv.style.border = '1px solid #d4af37';
                const container = document.querySelector('#cancelList');
                container.prepend(msgDiv);
            }
            msgDiv.innerText = res.message;
            msgDiv.style.color = '#111';
            msgDiv.style.backgroundColor = '#fdfbf2';
            
            setTimeout(() => {
                msgDiv.style.display = 'none';
                findAppointments(); 
            }, 2500);
        });
    }
</script>
</body>
</html>
